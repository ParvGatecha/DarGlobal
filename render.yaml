services:
  - type: web
    name: darglobal-intelligence-backend
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: AUTO_SELECT_FREE_MODEL
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: CORS_ORIGIN_REGEX
        value: "^https:\\/\\/.*\\.vercel\\.app$"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./data/chroma_db"
      - key: BM25_INDEX_PATH
        value: "./data/bm25_index.pkl"
      - key: CANONICAL_DATASET_PATH
        value: "./backend/data/canonical_dataset.json"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
